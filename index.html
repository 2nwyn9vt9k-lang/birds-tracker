<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Birding ID & Trip Tracker</title>

<style>
  :root {
    --em-900: #064e3b;
    --em-800: #065f46;
    --em-700: #047857;
    --em-600: #059669;
    --em-100: #d1fae5;
    --em-50: #ecfdf5;
    --amb-700: #b45309;
    --amb-600: #d97706;
    --amb-100: #fef3c7;
    --amb-50: #fffbeb;
    --red-500: #ef4444;
    --red-50: #fef2f2;
    --red-200: #fecaca;
    --violet-600: #7c3aed;
    --slate-800: #1e293b;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --slate-50: #f8fafc;
  }

  * { box-sizing: border-box; }

  body {
      margin: 0;
      background: var(--slate-100);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--slate-800);
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  .hero{background:linear-gradient(135deg,var(--em-800),var(--em-700),var(--em-600));border-radius:24px;padding:20px;margin-bottom:16px;color:#fff;box-shadow:0 10px 25px -10px rgba(6,78,59,.4);}
  .hero h1{margin:0;font-size:20px;display:flex;align-items:center;gap:8px;}
  .hero p{margin:6px 0 0;font-size:12px;color:#d1fae5;}
  .err{font-size:12px;color:#dc2626;background:var(--red-50);border:1px solid var(--red-200);border-radius:12px;padding:10px;margin-bottom:12px;}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--slate-200);}
  .navbtns{display:flex;gap:8px;flex-wrap:wrap;}
  .navbtn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--slate-200);background:#fff;color:var(--slate-500);cursor:pointer;}
  .navbtn.active{background:var(--em-700);color:#fff;border-color:var(--em-700);}
  h2{font-size:17px;margin:0 0 12px;color:var(--slate-800);}
  h3{font-size:14px;margin:0;color:var(--slate-700);}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .btn-link{background:none;color:var(--em-700);font-weight:600;font-size:13px;padding:4px 0;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:4px;}
  .card{background:#fff;border:1px solid var(--slate-200);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);}

  /* ===== Read-only detail panel (location header / species detail) =====
     Replaces the old "form-card" creation-form treatment now that nothing
     in the app is editable; same comfortable padding/rhythm, no input styling. */
  .detail-card{padding:16px;margin-bottom:14px;}
  .detail-card>*{margin-bottom:12px;}
  .detail-card>*:last-child{margin-bottom:0;}

  .loc-row{display:flex;align-items:center;justify-content:space-between;padding:13px;background:#fff;border:1px solid var(--slate-200);border-radius:14px;cursor:pointer;width:100%;text-align:left;}
  .loc-row:hover{border-color:var(--em-600);}
  .loc-left{display:flex;align-items:center;gap:9px;}
  .loc-badge{background:var(--em-100);color:var(--em-700);border-radius:10px;padding:5px 6px;font-size:13px;}
  .loc-name{font-size:13px;font-weight:600;color:var(--slate-800);}
  .loc-date{font-size:11px;color:var(--slate-400);margin-left:6px;}
  .loc-notes-display{font-size:13px;color:var(--slate-600);line-height:1.5;margin:0;}
  .count-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .count-empty{background:var(--slate-100);color:var(--slate-400);}
  .count-done{background:var(--em-600);color:#fff;}
  .count-prog{background:var(--em-50);color:var(--em-700);}
  .sp-card{border-radius:16px;padding:14px;border:1px solid var(--slate-200);background:#fff;margin-bottom:11px;}
  .sp-card.seen{background:var(--em-50);border-color:#6ee7b7;}
  .sp-inner{display:flex;align-items:flex-start;gap:11px;}

  /* ===== Checkbox + inline photo-thumbnail stack =====
     The checklist checkbox and its tiny reference-photo thumbnail are stacked
     in a fixed-width column so the rest of the card's text columns never
     shift, whether or not a given species has a photo on file. */
  .chk-stack{flex-shrink:0;width:38px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .chk{flex-shrink:0;width:38px;height:38px;border-radius:11px;border:2px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .chk.on{background:var(--em-600);border-color:var(--em-600);}
  .chk svg{display:none;}
  .chk.on svg{display:block;}
  .chk-thumb{width:38px;height:38px;border-radius:8px;overflow:hidden;flex-shrink:0;}
  .chk-thumb img{width:100%;height:100%;object-fit:cover;display:block;}

  .sp-name-link{background:none;border:none;padding:0;margin:0;font:inherit;font-weight:700;font-size:14.5px;color:var(--slate-800);cursor:pointer;display:flex;align-items:center;gap:3px;text-align:left;min-width:0;}
  .sp-name-link:hover{color:var(--em-700);}
  .sp-name-link svg{flex-shrink:0;color:var(--slate-400);}
  .sp-card.seen .sp-name-link{color:var(--em-800);}
  .sp-priority{font-size:12px;font-weight:700;color:var(--amb-600);white-space:nowrap;flex-shrink:0;}
  .pop-note-standalone{display:block;font-size:12px;font-style:italic;color:var(--slate-500);margin:4px 0 0;line-height:1.4;}
  .seen-else{font-size:11px;color:var(--amb-600);font-weight:600;margin:4px 0 0;}
  .logged-at{font-size:11px;color:var(--em-600);font-weight:600;margin:6px 0 0;}
  .idtoggle{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--slate-500);background:none;border:none;cursor:pointer;margin-top:9px;padding:0;}
  .idnotes{font-size:12px;color:var(--slate-500);margin-top:7px;background:var(--slate-50);border:1px solid #f1f5f9;border-radius:12px;padding:10px;}
  .idnotes p{margin:0 0 6px;}
  .idnotes p:last-child{margin-bottom:0;}
  .idnotes b{color:var(--slate-600);}
  .idnotes .sim{color:var(--amb-700);}
  /* Photo inline inside the "ID clues" dropdown — sits directly below the
     text fields, inside the same bordered/rounded idnotes panel. Omitted
     entirely (onerror hides the frame) when there is no photo or the file
     fails to load, matching the chk-thumb omit-if-missing behavior. */
  .idnotes-photo{margin-top:8px;border-radius:10px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--slate-200);}
  .idnotes-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .empty-msg{font-size:13px;color:var(--slate-400);font-style:italic;padding:20px 0;text-align:center;}
  .sp-lib-row{display:flex;align-items:center;justify-content:space-between;padding:11px;background:#fff;border:1px solid var(--slate-200);border-radius:12px;margin-bottom:7px;}
  .sp-lib-row button.lib-name{flex:1;text-align:left;background:none;border:none;font-size:13px;font-weight:600;color:var(--slate-800);cursor:pointer;}
  .noid{font-size:11px;color:var(--slate-400);font-style:italic;font-weight:400;margin-left:6px;}
  .field-label{font-size:11px;font-weight:700;color:var(--em-700);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px;}
  .field-block{margin-bottom:12px;}
  .field-text{font-size:13px;color:var(--slate-700);line-height:1.5;margin:0;}
  .back-link{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--slate-500);background:none;border:none;cursor:pointer;margin-bottom:14px;padding:0;}
  .back-link:hover{color:var(--em-700);}
  .lib-name-text{display:block;}
  .lib-loc-text{display:block;font-size:11px;color:var(--slate-400);margin-top:3px;font-weight:400;}
  .lib-seen-badge{font-size:10px;font-weight:700;color:var(--em-700);background:var(--em-100);border-radius:999px;padding:2px 7px;margin-left:6px;text-transform:uppercase;letter-spacing:.03em;}

  /* ===================== ENDEMIC NAME BADGE ===================== */
  .sp-endemic-badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--violet-600,#7c3aed);border-radius:5px;padding:0 4px;line-height:1.5;margin-left:5px;vertical-align:middle;}
  .sp-bonus-badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:#db2777;border-radius:5px;padding:0 4px;line-height:1.5;margin-left:5px;vertical-align:middle;}

  /* ===================== SPECIES LIBRARY: PRIORITY STARS ===================== */
  .lib-priority{font-size:12px;font-weight:700;color:var(--amb-600);white-space:nowrap;margin-left:8px;flex-shrink:0;}
  .lib-name-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .lib-name-text{flex:1;min-width:0;}
  .lib-pop-note{display:block;font-size:11.5px;color:var(--slate-500);font-style:italic;margin:4px 0 0;line-height:1.4;}

  /* ===================== STAGE 1 FINAL MOBILE FIXES ===================== */

  /* Force Navigation Buttons to Split 50/50 Full Width across the top */
  .navbtns {
      display: flex !important;
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
  }
  .navbtn {
      flex: 1 !important;
      width: 50% !important;
      text-align: center !important;
  }

  /* Style the Isolated Targets Search Bar — the ONLY text input in the app */
  .targets-search-wrapper {
      padding: 12px;
      background: var(--slate-100, #f1f5f9);
      border-bottom: 1px solid var(--slate-200, #e2e8f0);
  }
  #targetsSearch {
      width: 100% !important;
      font-size: 16px !important; /* Critical mobile zoom fix */
      padding: 10px !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      box-sizing: border-box !important;
      font-family: inherit;
      outline: none;
  }
  #targetsSearch:focus{border-color:var(--em-600) !important;box-shadow:0 0 0 2px var(--em-100);}

  /* ===== Global "Hide Already Seen Birds" sticky switch =====
     Used at the top of both the master Species Library and the per-stop
     field checklist ("Active Trip" view). Stays pinned to the top of the
     viewport while the (potentially long) species list scrolls beneath it. */
  .sticky-filter-bar{
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--slate-100);
      padding: 10px 14px;
      margin: 0 -16px 14px;
      border-bottom: 1px solid var(--slate-200);
      box-shadow: 0 4px 10px -6px rgba(0,0,0,.12);
  }
  .toggle-switch-row{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate-700);
      margin: 0;
      cursor: pointer;
  }
  .toggle-switch{
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
  }
  .toggle-switch input{
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
  }
  .toggle-slider{
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #cbd5e1;
      transition: background-color .18s ease;
      border-radius: 24px;
  }
  .toggle-slider:before{
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      transition: transform .18s ease;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .toggle-switch input:checked + .toggle-slider{ background: var(--em-600); }
  .toggle-switch input:checked + .toggle-slider:before{ transform: translateX(18px); }

  /* ===== "Cap at 15 Highest-Value Targets" toggle link =====
     Sits directly under a location's "Expected Species" header whenever that
     stop's full target list exceeds 15 entries. */
  .cap-toggle-link{
      display: inline-flex;
      margin: -4px 0 12px;
      font-size: 12px;
      text-decoration: underline;
      text-decoration-color: var(--em-100);
  }

  /* ===== Offline photo architecture (species detail view) =====
     Responsive image frame rendered directly below the species name header
     in the species detail view. Shows the real photo when photoData is
     populated and loads successfully, otherwise a premium minimalist
     placeholder (subtle CSS grid + bird silhouette icon) so the layout still
     looks intentional and balanced. */
  .sp-photo-frame{
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid var(--slate-200);
      position: relative;
  }
  .sp-photo-frame.is-empty{
      background-color: var(--slate-50);
      background-image:
        linear-gradient(var(--slate-200) 1px, transparent 1px),
        linear-gradient(90deg, var(--slate-200) 1px, transparent 1px);
      background-size: 18px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
  }
  .sp-photo-img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
  }
  .sp-photo-placeholder{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
  }
  .sp-photo-placeholder svg{ color: var(--slate-400); }
  .sp-photo-placeholder span{
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--slate-400);
  }

</style>

var state = {
  data: null,
  view: "locationList",
  activeLocationId: null,
  viewingSpeciesId: null,
  expandedNotes: {},
  expandedLocations: {},
  hideSeenGlobal: false,
  errorMsg: null
};

function uid(prefix){ return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s===undefined||s===null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }

/* ===================== PERSISTENCE =====================
   Trips, locations, and species ALWAYS load fresh from SEED_DATA in the
   code file itself, every time the page opens — so editing the code file
   is reflected immediately, with no stale-cache override risk.
   This is a read-only reference app: the ONLY thing that ever changes at
   runtime is which checkboxes are checked. localStorage is used solely to
   remember that `sightings` array, so logged sightings persist across
   sessions on the same computer. */
var SIGHTINGS_KEY = "birding-tracker-sightings-v1";

function loadSightings(){
  try{
    var raw = localStorage.getItem(SIGHTINGS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}

function loadData(){
  var data = JSON.parse(JSON.stringify(SEED_DATA));
  data.sightings = loadSightings();
  return data;
}

function save(){
  try{
    localStorage.setItem(SIGHTINGS_KEY, JSON.stringify(state.data.sightings || []));
  }catch(e){
    state.errorMsg = "Could not save your sightings. Your checked boxes may not persist between sessions.";
  }
}

/* ===================== DATA HELPERS ===================== */

function getSightingFor(locId, spId) {
  var list = state.data.sightings || [];
  return list.find(function(s) { return s.locationId === locId && s.speciesId === spId; });
}

function getOtherSightingsFor(spId, excludeLocId){
  var list = state.data.sightings || [];
  return list.filter(function(s){ return s.speciesId===spId && s.locationId!==excludeLocId; })
    .map(function(s){ return { s:s, loc: state.data.locations[s.locationId] }; })
    .filter(function(x){ return !!x.loc; });
}

function hasAnySighting(spId) {
  var list = state.data.sightings || [];
  return list.some(function(s) { return s.speciesId === spId; });
}

function getLocationNamesForSpecies(spId){
  return Object.keys(state.data.locations).map(function(k){return state.data.locations[k];})
    .filter(function(loc){ return loc.speciesIds.indexOf(spId)!==-1; })
    .map(function(loc){ return loc.name; });
}

/* priorityValue: turns a "★★★"/"★★"/"★"/"" priority string into a sortable number (3,2,1,0).
   NOTE: this deliberately reads sp.priority (never the displayed †-prefixed string) — the
   dagger is rendering-only via priorityDisplay() below, so it can never corrupt this sort. */
function priorityValue(sp){
  return sp && sp.priority ? sp.priority.length : 0;
}

/* priorityDisplay: the visible priority string, with the trip-unique "†" prefix layered on
   at render time only. tripUnique never pairs with a blank priority (Bonus rows are never
   trip-unique by definition), but the empty-priority guard is kept defensively anyway. */
function priorityDisplay(sp){
  if(!sp || !sp.priority) return "";
  return (sp.tripUnique ? "†" : "") + sp.priority;
}

/* speciesNameBadges: returns the small "E" (endemic) / "B" (bonus) markers that belong
   directly after a species name. Both flags are parsed strictly in the background — there
   is no UI control for either anywhere in this read-only build; it either renders the
   badge or it doesn't. Bonus ("B") marks an aspirational/long-shot target kept despite the
   Vagrancy Filter — it always pairs with a blank priority (no star), per the species file's
   4-Factor methodology. */
function speciesNameBadges(sp){
  var html = "";
  if(sp.endemic) html += ' <span class="sp-endemic-badge" title="Endemic / near-endemic">E</span>';
  if(sp.bonus) html += ' <span class="sp-bonus-badge" title="Bonus — aspirational long-shot, no prep tier">B</span>';
  return html;
}

/* ===================== APP (read-only: navigation + checklist only) ===================== */
var App = {};

/* This app is permanently scoped to the single 2027 trip ("trip-1"). The
   Location List dashboard is the root/home view — there is no multi-trip
   landing page to navigate back to. */
App.goLocationList = function(){ state.view="locationList"; state.activeLocationId=null; render(); };
App.goLocation = function(locId){ state.activeLocationId=locId; state.view="locationDetail"; render(); };
App.goSpeciesLibrary = function(){ state.view="speciesLibrary"; render(); };
App.goSpeciesDetail = function(spId){ state.viewingSpeciesId=spId; state.view="speciesDetail"; render(); };

App.toggleHideSeen = function(){ state.hideSeenGlobal = !state.hideSeenGlobal; render(); };
App.toggleLocationExpand = function(locId){ state.expandedLocations[locId] = !state.expandedLocations[locId]; render(); };

/* logSighting/unlogSighting: tapping the checklist checkbox is the one piece
   of "data entry" this app still performs in the field — checking a box logs
   a sighting locally; eBird remains the authoritative external record. */
App.logSighting = function(locId, spId){
  if(!state.data.sightings) state.data.sightings = [];
  state.data.sightings.push({ id:uid("sight"), locationId:locId, speciesId:spId, timestamp:new Date().toISOString() });
  save(); render();
};
App.unlogSighting = function(sightId){
  state.data.sightings = (state.data.sightings || []).filter(function(s){ return s.id!==sightId; });
  save(); render();
};

App.toggleNotes = function(spId){
  state.expandedNotes[spId] = !state.expandedNotes[spId];
  render();
};

/* renderHideSeenToggle: shared sticky "Hide Already Seen Birds" switch used at the
   top of both the master Species Library and the per-stop field checklist (the
   "Active Trip" view). A single global flag (state.hideSeenGlobal) drives both, so
   the filter setting is consistent everywhere it appears. This is a view filter,
   not a data edit, so it stays interactive in the read-only build. */
function renderHideSeenToggle(){
  return '<div class="sticky-filter-bar"><label class="toggle-switch-row"><span>Hide Already Seen Birds</span><span class="toggle-switch"><input type="checkbox" '+(state.hideSeenGlobal?'checked':'')+' onchange="App.toggleHideSeen()"><span class="toggle-slider"></span></span></label></div>';
}

function render(){
  var app = document.getElementById("app");
  var html = '<div class="hero"><h1 onclick="App.goLocationList()" style="cursor:pointer;">Birding ID & Trip Tracker</h1><p>Aspirational species and field ID notes.</p></div>';
  if(state.errorMsg) html += '<div class="err">'+esc(state.errorMsg)+'</div>';
  html += renderNav();
  html += '<div id="viewContent">' + renderViewContent() + '</div>';
  app.innerHTML = html;
}

function renderNav(){
  var tabs = [
    { key:"locationList", label:"Itinerary", icon:ICONS.pin, on:function(){return state.view==="locationList"||state.view==="locationDetail";} },
    { key:"speciesLibrary", label:"Targets", icon:'', on:function(){return state.view==="speciesLibrary"||state.view==="speciesDetail";} }
  ];
  var fns = { locationList:"App.goLocationList()", speciesLibrary:"App.goSpeciesLibrary()" };
  var btns = tabs.map(function(t){
    return '<button class="navbtn '+(t.on()?'active':'')+'" onclick="'+fns[t.key]+'">'+t.icon+esc(t.label)+'</button>';
  }).join("");
  return '<div class="nav"><div class="navbtns">'+btns+'</div></div>';
}

/* App.filterTargets: drives the ONLY text input permitted anywhere in this
   app — the Species Library search bar. It is a client-side filter over
   already-rendered rows, not a data edit. */
App.filterTargets = function() {
  var query = document.getElementById("targetsSearch").value.toLowerCase();
  var items = document.querySelectorAll(".library-item");
  items.forEach(function(item) {
    var text = item.textContent.toLowerCase();
    item.style.display = text.includes(query) ? "" : "none";
  });
};

function renderViewContent(){
  switch(state.view){
    case "locationList": return renderLocationList();
    case "locationDetail": return renderLocationDetail();
    case "speciesLibrary": return renderSpeciesLibrary();
    case "speciesDetail": return renderSpeciesDetail();
    default: return "";
  }
}

/* renderLocationList: the permanent root/home view of the app. Trip 1 (2027) is
   the only trip this build knows about, so there is no multi-trip landing page —
   this goes straight to that trip's full stop-by-stop itinerary dashboard. */
function renderLocationList(){
  var trip = state.data.trips["trip-1"];
  var locIds = trip ? trip.locations : Object.keys(state.data.locations);
  var html = '<div class="row"><h2>Itinerary</h2></div>';
  html += '<div class="card">';
  if(locIds.length===0){
    html += '<p class="empty-msg">No locations in this itinerary.</p>';
  }
  locIds.forEach(function(locId){
    var loc = state.data.locations[locId];
    if(!loc) return;
    var realIds = loc.speciesIds.filter(function(sid){ var sp=state.data.species[sid]; return !(sp && sp.bonus); });
    var seenCount = realIds.filter(function(sid){ return !!getSightingFor(locId,sid); }).length;
    var allSeen = realIds.length>0 && seenCount===realIds.length;
    var pillClass = realIds.length===0 ? "count-empty" : (allSeen ? "count-done" : "count-prog");
    var pillText = realIds.length===0 ? "no list yet" : (seenCount+"/"+realIds.length+" seen");
    html += '<div class="loc-row" onclick="App.goLocation(\''+locId+'\')"><span class="loc-left"><span class="loc-badge">'+ICONS.pin+'</span><span class="loc-name">'+esc(loc.name)+'</span>'+(loc.date?'<span class="loc-date">'+ICONS.cal+' '+esc(loc.date)+'</span>':'')+'</span><span class="count-pill '+pillClass+'">'+pillText+'</span></div>';
  });
  html += '</div>';
  return html;
}

function renderLocationDetail(){
  var loc = state.data.locations[state.activeLocationId];
  if(!loc) return '<p class="empty-msg">Location not found.</p>';
  var fullList = loc.speciesIds.map(function(id){ return state.data.species[id]; }).filter(Boolean);
  // Sort by value (priority stars) highest first, so the trip-defining targets surface to the top of the field checklist.
  fullList.sort(function(a,b){
    var diff = priorityValue(b) - priorityValue(a);
    if(diff!==0) return diff;
    return a.name.localeCompare(b.name);
  });
  var totalCount = fullList.length;
  var realTargetCount = fullList.filter(function(sp){ return !sp.bonus; }).length;
  var isExpanded = !!state.expandedLocations[loc.id];
  /* "Cap at 15 Highest-Value Targets": by default only the top 15 by priority are
     shown for field efficiency, with a toggle link below to expand to the full list.
     The cap is applied FIRST. The "Hide Already Seen" filter (if on) is applied
     afterward and simply shrinks whatever remains in view — it does not backfill
     replacement targets from beyond the cap. */
  var cappedList = (totalCount > 15 && !isExpanded) ? fullList.slice(0, 15) : fullList;
  var speciesList = state.hideSeenGlobal ? cappedList.filter(function(sp){ return !hasAnySighting(sp.id); }) : cappedList;

  var html = '<button class="back-link" onclick="App.goLocationList()">'+ICONS.chev_left+' Back to Location List</button>';
  html += renderHideSeenToggle();
  html += '<div class="card detail-card"><h2 style="margin:0;">'+esc(loc.name)+'</h2>';
  if(loc.date) html += '<p style="font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:4px;margin:0;">'+ICONS.cal+' '+esc(loc.date)+'</p>';
  if(loc.notes) html += '<p class="loc-notes-display">'+esc(loc.notes)+'</p>';
  html += '</div>';

  var realSpeciesList = speciesList.filter(function(sp){ return !sp.bonus; });
  var countLabel = (realSpeciesList.length===realTargetCount) ? String(realTargetCount) : (realSpeciesList.length+' of '+realTargetCount);
  html += '<h3 style="margin-bottom:12px;">Expected Species ('+countLabel+')</h3>';

  if(totalCount > 15){
    html += '<button class="btn-link cap-toggle-link" onclick="App.toggleLocationExpand(\''+loc.id+'\')">'+(isExpanded ? 'Show top 15 only' : 'Show all '+totalCount+' species')+'</button>';
  }

  if(totalCount===0){
    html += '<p class="empty-msg">No species list for this location.</p>';
  } else if(speciesList.length===0){
    html += '<p class="empty-msg">Everything currently in view here is already logged as seen. Turn off "Hide Already Seen Birds" above to see them again.</p>';
  }

  speciesList.forEach(function(sp){
    var sighting = getSightingFor(loc.id, sp.id);
    var others = getOtherSightingsFor(sp.id, loc.id);
    var hasNotes = !!(sp.close||sp.medium||sp.long||sp.pelagic||sp.similar||sp.photoData);
    var notesOpen = !!state.expandedNotes[sp.id];
    html += '<div class="sp-card '+(sighting?'seen':'')+'"><div class="sp-inner">';

    /* Checkbox + tiny photo-thumbnail stack (instruction 6): the thumbnail
       sits directly beneath the checkbox at the same square width, and is
       simply omitted (leaving empty space) when there is no photo on file
       or the photo fails to load. */
    html += '<div class="chk-stack">';
    html += '<button class="chk '+(sighting?'on':'')+'" onclick="'+(sighting?"App.unlogSighting('"+sighting.id+"')":"App.logSighting('"+loc.id+"','"+sp.id+"')")+'">'+ICONS.check+'</button>';
    if(sp.photoData){
      html += '<div class="chk-thumb"><img src="'+escAttr(sp.photoData)+'" alt="" onerror="this.parentElement.style.display=\'none\'"></div>';
    }
    html += '</div>';

    html += '<div style="flex:1;min-width:0;">';
    html += '<div class="row" style="margin-bottom:0;">';
    html += '<button class="sp-name-link" onclick="App.goSpeciesDetail(\''+sp.id+'\')"><span>'+esc(sp.name)+speciesNameBadges(sp)+'</span>'+ICONS.chev_right+'</button>';
    if(sp.priority) html += '<span class="sp-priority" title="'+(sp.tripUnique?'Trip-unique — only realistic shot at this species on the whole trip':'')+'">'+esc(priorityDisplay(sp))+'</span>';
    html += '</div>';
    if(sp.notes) html += '<p class="pop-note-standalone">'+esc(sp.notes)+'</p>';
    if(!sighting && others.length>0){
      html += '<p class="seen-else">Already seen — also recorded at: '+others.map(function(o){return esc(o.loc.name);}).join(", ")+' ('+new Date(others[0].s.timestamp).toLocaleDateString()+')</p>';
    }
    if(sighting){
      html += '<p class="logged-at">Logged '+new Date(sighting.timestamp).toLocaleString()+'</p>';
    }
    if(hasNotes){
      html += '<button class="idtoggle" onclick="App.toggleNotes(\''+sp.id+'\')">'+(notesOpen?ICONS.chev_down:ICONS.chev_right)+'ID clues</button>';
      if(notesOpen){
        html += '<div class="idnotes">';
        if(sp.close) html += '<p><b>Close:</b> '+esc(sp.close)+'</p>';
        if(sp.medium) html += '<p><b>Medium:</b> '+esc(sp.medium)+'</p>';
        if(sp.long) html += '<p><b>Long:</b> '+esc(sp.long)+'</p>';
        if(sp.pelagic) html += '<p><b>Pelagic:</b> '+esc(sp.pelagic)+'</p>';
        if(sp.similar) html += '<p class="sim"><b>Similar:</b> '+esc(sp.similar)+'</p>';
        if(sp.photoData){
          html += '<div class="idnotes-photo"><img src="'+escAttr(sp.photoData)+'" alt="" onerror="this.parentElement.style.display=\'none\'"></div>';
        }
        html += '</div>';
      }
    }
    html += '</div></div></div>';
  });
  return html;
}

function renderSpeciesLibrary(){
  var all = Object.keys(state.data.species).map(function(k){return state.data.species[k];}).sort(function(a,b){return a.name.localeCompare(b.name);});
  if(state.hideSeenGlobal) all = all.filter(function(sp){ return !hasAnySighting(sp.id); });
  var html = renderHideSeenToggle();
  html += '<div class="row"><h2>Species Library ('+all.length+')</h2></div>';
  html += '<p style="font-size:12px;color:#64748b;margin:-6px 0 14px;">Your master species reference for this trip — field ID notes for every target, in one place.</p>';
  html += '<div class="targets-search-wrapper" style="margin-bottom:14px;"><input type="text" id="targetsSearch" placeholder="Search species or locations..." oninput="App.filterTargets()"></div>';

  if(all.length===0){
    html += '<p class="empty-msg">Everything in your library is already logged as seen. Turn off "Hide Already Seen Birds" above to see it again.</p>';
  }

  all.forEach(function(sp){
    var noId = !sp.close && !sp.medium && !sp.long && !sp.pelagic && !sp.similar;
    var locs = getLocationNamesForSpecies(sp.id);
    var locText = locs.length ? esc(locs.join(", ")) : "Not yet assigned to a location";
    var seenBadge = hasAnySighting(sp.id) ? '<span class="lib-seen-badge">Already seen</span>' : '';
    var priorityBadge = sp.priority ? '<span class="lib-priority" title="'+(sp.tripUnique?'Trip-unique — only realistic shot at this species on the whole trip':'')+'">'+esc(priorityDisplay(sp))+'</span>' : '';
    var popNote = sp.notes ? '<span class="lib-pop-note">'+esc(sp.notes)+'</span>' : '';

    html += '<div class="sp-lib-row library-item"><button class="lib-name" onclick="App.goSpeciesDetail(\''+sp.id+'\')"><span class="lib-name-row"><span class="lib-name-text">'+esc(sp.name)+speciesNameBadges(sp)+(noId?'<span class="noid">no ID notes yet</span>':'')+seenBadge+'</span>'+priorityBadge+'</span><span class="lib-loc-text">'+locText+'</span>'+popNote+'</button></div>';
  });
  return html;
}

function renderSpeciesDetail(){
  var sp = state.data.species[state.viewingSpeciesId];
  if(!sp) return '<p class="empty-msg">Species not found.</p><button class="back-link" onclick="App.goSpeciesLibrary()">'+ICONS.chev_left+' Back to library</button>';
  var fields = [
    {k:"close", l:"Close range"},
    {k:"medium", l:"Medium range"},
    {k:"long", l:"Long range / silhouette"},
    {k:"pelagic", l:"Pelagic / flight ID"},
    {k:"similar", l:"Similar species to watch for"}
  ];
  var html = '<button class="back-link" onclick="App.goSpeciesLibrary()">'+ICONS.chev_left+' Back to library</button>';
  html += '<div class="card detail-card">';
  html += '<h2 style="margin:0;">'+esc(sp.name)+speciesNameBadges(sp)+'</h2>';

  /* Offline photo architecture: a responsive image frame sits right below the
     species name header. If photoData resolves to a real image it renders as
     a photo; if it is missing or fails to load, a premium minimalist
     placeholder (subtle CSS grid + bird silhouette icon) keeps the layout
     looking intentional instead of leaving a hole. */
  if(sp.photoData){
    html += '<div class="sp-photo-frame"><img class="sp-photo-img" src="'+escAttr(sp.photoData)+'" alt="'+escAttr(sp.name)+' reference photo" onerror="this.parentElement.classList.add(\'is-empty\');this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div class="sp-photo-placeholder" style="display:none;">'+ICONS.birdSilhouette+'<span>No photo yet</span></div></div>';
  } else {
    html += '<div class="sp-photo-frame is-empty"><div class="sp-photo-placeholder">'+ICONS.birdSilhouette+'<span>No photo yet</span></div></div>';
  }

  if(sp.notes) html += '<div class="field-block"><span class="field-label">Population / Where to See</span><p class="field-text">'+esc(sp.notes)+'</p></div>';
  fields.forEach(function(f){
    if(sp[f.k]) html += '<div class="field-block"><span class="field-label">'+f.l+'</span><p class="field-text">'+esc(sp[f.k])+'</p></div>';
  });

  html += '</div>';
  return html;
}

/* ===================== INIT ===================== */
state.data = loadData();
render();
</script>
